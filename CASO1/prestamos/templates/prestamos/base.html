<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>{% block title %}Préstamos UNCP{% endblock %}</title></head>
<body>
<nav><a href="{% url 'catalogo' %}">Catálogo</a>
{% if user.is_authenticated %}<a href="{% url 'mis_prestamos' %}">Mis préstamos</a><a href="{% url 'solicitar' %}">Solicitar</a><a href="{% url 'logout' %}">Salir</a>{% else %}<a href="{% url 'login' %}">Ingresar</a>{% endif %}</nav>
{% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</body></html>
